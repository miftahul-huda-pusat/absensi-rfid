  apiKey: "AIzaSyBDGplRg7XSwJSynKI_55tH6iRt2HbtlFg",
  authDomain: "absensirfid-96aa9.firebaseapp.com",
  databaseURL: "https://absensirfid-96aa9-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absensirfid-96aa9",
  storageBucket: "absensirfid-96aa9.appspot.com",

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// Global variable to store all history entries for filtering
let allHistoryEntries = [];

function getPrayerStatus(timeString) {
  try {
    // Bersihkan dan validasi format waktu
    timeString = timeString.trim().replace(/\./g, ':');
    if (!/^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(timeString)) {
      console.error(`Format waktu tidak valid: ${timeString}`);
      return { status: 'Invalid Format', class: 'status-invalid' };
    }

    const [hours, minutes] = timeString.split(':').map(Number);
    const totalMinutes = hours * 60 + minutes;
    
    // Perluas rentang waktu dengan buffer 30 menit
    if (totalMinutes >= 180 && totalMinutes <= 360) {       // 03:00 - 06:00 (Subuh)
      return { status: 'Subuh', class: 'status-subuh' };
    } else if (totalMinutes >= 840 && totalMinutes <= 990) { // 14:00 - 16:30 (Ashar)
      return { status: 'Ashar', class: 'status-ashar' };
    } else if (totalMinutes >= 1020 && totalMinutes <= 1200) { // 17:00 - 20:00 (Maghrib)
      return { status: 'Maghrib', class: 'status-maghrib' };
    } else {
      console.warn(`Waktu tidak sesuai jadwal sholat: ${timeString} (${totalMinutes} menit)`);
      return { status: 'Tidak masuk', class: 'status-invalid' };
    }
  } catch (error) {
    console.error(`Error processing time: ${timeString}`, error);
    return { status: 'Error', class: 'status-invalid' };
  }
}

onAuthStateChanged(auth, user => {
  document.getElementById("login-form").style.display = user ? "none" : "block";
  document.getElementById("admin-page").style.display = user ? "block" : "none";
  if (user) {
    loadRegisteredCards();
    loadUnregisteredCards();
    loadHistoryDetails();
    generateMonthlyReport();
  }
});

window.login = function(event) {
  event.preventDefault();
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;
  signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Login gagal: " + e.message));
};

window.logout = () => signOut(auth);

function loadRegisteredCards() {
  const tableBody = document.querySelector("#registered-cards-table tbody");
  onValue(ref(db, "absensi"), snapshot => {
    tableBody.innerHTML = "";
    snapshot.forEach(child => {
      const uid = child.key;
      const data = child.val();
      if (data.nama && data.nama !== "Belum Valid") {
        const nama = data.nama;
        const kelas = data.kelas || "Belum diatur";
        tableBody.innerHTML += `
          <tr>
            <td>${nama}</td>
            <td>${kelas}</td>
            <td class="uid-cell">${uid}</td>
            <td class="text-nowrap">
              <button class="btn btn-warning btn-sm" onclick="editCard('${uid}', '${nama}', '${kelas}')">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteCard('${uid}')">
                <i class="fas fa-trash"></i> Hapus
              </button>
            </td>
          </tr>`;
      }
    });
  });
}

function loadUnregisteredCards() {
  const tableBody = document.querySelector("#unregistered-cards-table tbody");
  onValue(ref(db, "absensi"), snapshot => {
    tableBody.innerHTML = "";
    snapshot.forEach(child => {
      const uid = child.key;
      const data = child.val();
      if (!data.nama || data.nama === "Belum Valid") {
        tableBody.innerHTML += `
          <tr>
            <td class="uid-cell">${uid}</td>
            <td class="text-nowrap">
              <button class="btn btn-primary btn-sm" onclick="registerNewCard('${uid}')">
                <i class="fas fa-plus"></i> Daftarkan
              </button>
            </td>
          </tr>`;
      }
    });
  });
}

window.registerNewCard = function(uid) {
  const nama = prompt("Masukkan nama untuk kartu ini:");
  if (!nama) return;
  
  const kelas = prompt("Masukkan kelas untuk " + nama + ":");
  
  if (nama && kelas) {
    set(ref(db, `absensi/${uid}`), {
      nama: nama,
      kelas: kelas,
      history: {}
    }).then(() => {
      alert("Kartu berhasil didaftarkan!");
      loadRegisteredCards();
      loadUnregisteredCards();
    }).catch(error => {
      alert("Gagal mendaftarkan kartu: " + error.message);
    });
  }
};

window.editCard = function(uid, currentName, currentClass) {
  const newName = prompt("Masukkan nama baru:", currentName);
  if (newName === null) return;
  
  const newClass = prompt("Masukkan kelas baru:", currentClass || "");
  
  if (newName && newClass) {
    update(ref(db, `absensi/${uid}`), {
      nama: newName,
      kelas: newClass
    }).then(() => {
      alert("Data kartu berhasil diperbarui!");
      loadRegisteredCards();
    }).catch(error => {
      alert("Gagal memperbarui data: " + error.message);
    });
  }
};

window.deleteCard = function(uid) {
  if (confirm("Apakah Anda yakin ingin menghapus kartu ini?")) {
    remove(ref(db, `absensi/${uid}`))
      .then(() => {
        alert("Kartu berhasil dihapus!");
        loadRegisteredCards();
        loadUnregisteredCards();
      })
      .catch(error => {
        alert("Gagal menghapus kartu: " + error.message);
      });
  }
};

window.hapusSemuaRiwayat = async function () {
  if (!confirm("Apakah Anda yakin ingin menghapus SEMUA riwayat absensi?")) return;
  
  const absensiRef = ref(db, "absensi");
  try {
    const snapshot = await get(absensiRef);
    if (!snapshot.exists()) return alert("Tidak ada data untuk dihapus.");
    
    const promises = [];
    snapshot.forEach(child => {
      const uid = child.key;
      promises.push(update(ref(db, `absensi/${uid}`), { history: {} }));
    });
    
    await Promise.all(promises);
    alert("Semua riwayat berhasil dihapus.");
    loadHistoryDetails();
  } catch (err) {
    alert("Gagal menghapus riwayat: " + err.message);
  }
};

function loadHistoryDetails() {
  const tbody = document.getElementById("history-table-body");
  onValue(ref(db, "absensi"), snapshot => {
    tbody.innerHTML = "";
    allHistoryEntries = []; // Reset the stored entries
    let debugData = [];
    
    snapshot.forEach(child => {
      const uid = child.key;
      const nama = child.val().nama || "Tidak Dikenal";
      const kelas = child.val().kelas || "Belum diatur";
      const history = child.val().history || {};
      
      Object.values(history).forEach(entry => {
        try {
          const waktuObj = new Date(entry.waktu + "Z");
          if (isNaN(waktuObj.getTime())) {
            console.error(`Invalid date: ${entry.waktu}`);
            return;
          }
          
          // Format tanggal dan jam
          const tanggal = waktuObj.toLocaleDateString("id-ID", { 
            timeZone: "Asia/Jakarta",
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }).replace(/\//g, '/');
          
          const tanggalForFilter = waktuObj.toISOString().split('T')[0]; // YYYY-MM-DD format for date filter
          const bulan = waktuObj.getMonth(); // For month filter
          
          const jam = waktuObj.toLocaleTimeString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: false
          }).replace(/\./g, ':');
          
          // Debug original and processed time
          debugData.push({
            original: entry.waktu,
            processed: jam,
            timestamp: waktuObj.getTime()
          });
          
          const statusInfo = getPrayerStatus(jam);
          
          allHistoryEntries.push({
            nama,
            kelas,
            uid,
            tanggal,
            tanggalForFilter,
            bulan,
            jam,
            status: statusInfo.status,
            statusClass: statusInfo.class,
            waktuObj
          });
        } catch (error) {
          console.error('Error processing entry:', entry, error);
        }
      });
    });
    
    // Log debug information
    console.table(debugData);
    
    // Urutkan berdasarkan waktu terbaru
    allHistoryEntries.sort((a, b) => b.waktuObj - a.waktuObj);
    
    // Apply any existing filters
    applyFilters();
    
    updateCharts(allHistoryEntries);
  });
}

// Filter functions
window.applyFilters = function() {
  const tbody = document.getElementById("history-table-body");
  const namaFilter = document.getElementById('filterNama').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const tanggalFilter = document.getElementById('filterTanggal').value;
  const bulanFilter = document.getElementById('filterBulan').value;
  
  tbody.innerHTML = "";
  
  let filteredEntries = allHistoryEntries.filter(entry => {
    // Filter by name
    if (namaFilter && !entry.nama.toLowerCase().includes(namaFilter)) {
      return false;
    }
    
    // Filter by status
    if (statusFilter && entry.status !== statusFilter) {
      return false;
    }
    
    // Filter by date
    if (tanggalFilter && entry.tanggalForFilter !== tanggalFilter) {
      return false;
    }
    
    // Filter by month
    if (bulanFilter !== "" && entry.bulan !== parseInt(bulanFilter)) {
      return false;
    }
    
    return true;
  });
  
  // Display filtered results
  filteredEntries.forEach((entry, index) => {
    tbody.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${entry.nama}</td>
        <td>${entry.kelas}</td>
        <td class="uid-cell">${entry.uid}</td>
        <td>${entry.tanggal}</td>
        <td>${entry.jam}</td>
        <td class="${entry.statusClass}">${entry.status}</td>
      </tr>`;
  });
}

window.resetFilters = function() {
  document.getElementById('filterNama').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterTanggal').value = '';
  document.getElementById('filterBulan').value = '';
  applyFilters();
}

// Fungsi untuk mengekspor data ke Excel
window.exportToExcel = async function() {
  try {
    const snapshot = await get(ref(db, "absensi"));
    if (!snapshot.exists()) return alert("Tidak ada data untuk diekspor.");
    
    let allEntries = [];
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    
    // Kumpulkan semua data
    snapshot.forEach(child => {
      const uid = child.key;
      const nama = child.val().nama || "Tidak Dikenal";
      const kelas = child.val().kelas || "Belum diatur";
      const history = child.val().history || {};
      
      Object.values(history).forEach(entry => {
        const waktuObj = new Date(entry.waktu + "Z");
        // Filter hanya bulan ini
        if (waktuObj.getMonth() === currentMonth && waktuObj.getFullYear() === currentYear) {
          const tanggal = waktuObj.toLocaleDateString("id-ID", { 
            timeZone: "Asia/Jakarta",
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }).replace(/\//g, '/');
          const jam = waktuObj.toLocaleTimeString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit'
          });
          
          const statusInfo = getPrayerStatus(jam);
          
          allEntries.push({
            nama,
            kelas,
            uid,
            tanggal,
            jam,
            status: statusInfo.status,
            waktuObj
          });
        }
      });
    });
    
    // Buat data untuk Excel
    const excelData = [];
    const users = {};
    
    // Kelompokkan data berdasarkan user dan tanggal
    allEntries.forEach(entry => {
      if (!users[entry.uid]) {
        users[entry.uid] = {
          nama: entry.nama,
          kelas: entry.kelas,
          dates: {}
        };
      }
      
      const dateKey = entry.tanggal;
      if (!users[entry.uid].dates[dateKey]) {
        users[entry.uid].dates[dateKey] = {
          Subuh: false,
          Ashar: false,
          Maghrib: false
        };
      }
      
      if (entry.status === 'Subuh') users[entry.uid].dates[dateKey].Subuh = true;
      if (entry.status === 'Ashar') users[entry.uid].dates[dateKey].Ashar = true;
      if (entry.status === 'Maghrib') users[entry.uid].dates[dateKey].Maghrib = true;
    });
    
    // Buat header untuk Excel
    const header = ['No', 'Nama', 'Kelas'];
    const dates = Object.keys(users[Object.keys(users)[0]]?.dates || {}).sort();
    dates.forEach(date => {
      header.push(`${date} (Subuh)`);
      header.push(`${date} (Ashar)`);
      header.push(`${date} (Maghrib)`);
    });
    excelData.push(header);
    
    // Isi data untuk Excel
    Object.keys(users).forEach((uid, index) => {
      const user = users[uid];
      const row = [
        index + 1,
        user.nama,
        user.kelas
      ];
      
      dates.forEach(date => {
        const attendance = user.dates[date] || { Subuh: false, Ashar: false, Maghrib: false };
        row.push(attendance.Subuh ? 'Hadir' : 'Tidak Hadir');
        row.push(attendance.Ashar ? 'Hadir' : 'Tidak Hadir');
        row.push(attendance.Maghrib ? 'Hadir' : 'Tidak Hadir');
      });
      
      excelData.push(row);
    });
    
    // Buat worksheet
    const ws = XLSX.utils.aoa_to_sheet(excelData);
    
    // Buat workbook
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Rekap Absensi");
    
    // Export ke file
    const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const fileName = `Rekap_Absensi_${monthNames[currentMonth]}_${currentYear}.xlsx`;
    XLSX.writeFile(wb, fileName);
    
  } catch (error) {
    alert("Gagal mengekspor data: " + error.message);
  }
};

// Fungsi untuk membuat laporan bulanan
async function generateMonthlyReport() {
  try {
    const snapshot = await get(ref(db, "absensi"));
    if (!snapshot.exists()) return;
    
    const tbody = document.getElementById("monthly-report-body");
    tbody.innerHTML = "";
    
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    
    const users = {};
    
    // Kumpulkan data absensi
    snapshot.forEach(child => {
      const uid = child.key;
      const nama = child.val().nama || "Tidak Dikenal";
      const kelas = child.val().kelas || "Belum diatur";
      const history = child.val().history || {};
      
      if (!users[uid]) {
        users[uid] = {
          nama,
          kelas,
          Subuh: 0,
          Ashar: 0,
          Maghrib: 0
        };
      }
      
      Object.values(history).forEach(entry => {
        const waktuObj = new Date(entry.waktu + "Z");
        if (waktuObj.getMonth() === currentMonth && waktuObj.getFullYear() === currentYear) {
          const jam = waktuObj.toLocaleTimeString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit'
          });
          
          const statusInfo = getPrayerStatus(jam);
          if (statusInfo.status === 'Subuh') users[uid].Subuh++;
          if (statusInfo.status === 'Ashar') users[uid].Ashar++;
          if (statusInfo.status === 'Maghrib') users[uid].Maghrib++;
        }
      });
    });
    
    // Tampilkan di tabel
    let index = 1;
    for (const uid in users) {
      const user = users[uid];
      const subuhClass = user.Subuh > 0 ? 'hadir' : 'tidak-hadir';
      const asharClass = user.Ashar > 0 ? 'hadir' : 'tidak-hadir';
      const maghribClass = user.Maghrib > 0 ? 'hadir' : 'tidak-hadir';
      
      tbody.innerHTML += `
        <tr>
          <td>${index++}</td>
          <td>${user.nama}</td>
          <td>${user.kelas}</td>
          <td class="${subuhClass}">${user.Subuh > 0 ? 'Hadir' : 'Tidak Hadir'}</td>
          <td class="${asharClass}">${user.Ashar > 0 ? 'Hadir' : 'Tidak Hadir'}</td>
          <td class="${maghribClass}">${user.Maghrib > 0 ? 'Hadir' : 'Tidak Hadir'}</td>
        </tr>`;
    }
    
  } catch (error) {
    console.error("Gagal membuat laporan bulanan:", error);
  }
}

let hariIniChart, mingguIniChart;

function updateCharts(entries) {
  const today = new Date();
  const todayFormatted = today.toLocaleDateString("id-ID", { 
    timeZone: "Asia/Jakarta",
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  }).replace(/\//g, '/');
  
  // Data untuk chart hari ini
  const todayData = {
    'Subuh': 0,
    'Ashar': 0,
    'Maghrib': 0,
    'Invalid': 0
  };
  
  entries.forEach(entry => {
    if (entry.tanggal === todayFormatted) {
      todayData[entry.status] = (todayData[entry.status] || 0) + 1;
    }
  });
  
  // Data untuk chart minggu ini
  const weekData = {};
  entries.forEach(entry => {
    weekData[entry.tanggal] = (weekData[entry.tanggal] || 0) + 1;
  });
  
  updateChartHariIni(todayData);
  updateChartMingguan(weekData);
}

function updateChartHariIni(data) {
  const ctx = document.getElementById("hariIniChart").getContext("2d");
  if (hariIniChart) hariIniChart.destroy();
  
  const labels = Object.keys(data);
  const values = Object.values(data);
  const backgroundColors = [
    '#126e31', // Subuh - hijau
    '#1cc88a', // Ashar - Hijau
    '#f6c23e', // Maghrib - Kuning
    '#e74a3b',  // Invalid - Merah
    '#fc948b'  // Default - Abu-abu
  ];
  
  hariIniChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: backgroundColors,
        borderWidth: 1
      }]
    },
    options: { 
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        title: { 
          display: true, 
          text: "Absensi Hari Ini",
          font: {
            size: 14
          }
        },
        legend: {
          position: 'bottom',
          labels: {
            boxWidth: 12,
            padding: 10,
            font: {
              size: 10
            }
          }
        }
      }
    }
  });
}

function updateChartMingguan(data) {
  const ctx = document.getElementById("mingguIniChart").getContext("2d");
  if (mingguIniChart) mingguIniChart.destroy();
  
  // Ambil 7 hari terakhir
  const dates = Object.keys(data).sort().reverse().slice(0, 7).reverse();
  const values = dates.map(date => data[date] || 0);
  
  mingguIniChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: dates,
      datasets: [{
        label: "Jumlah Absensi",
        data: values,
        backgroundColor: '#36b9cc',
        borderColor: '#2c9faf',
        borderWidth: 1
      }]
    },
    options: { 
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        title: { 
          display: true, 
          text: "Absensi 7 Hari Terakhir",
          font: {
            size: 14
          }
        },
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1
          }
        },
        x: {
          ticks: {
            maxRotation: 45,
            minRotation: 45
          }
        }
      }
    }
  });
}
